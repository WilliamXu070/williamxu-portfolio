name: Portfolio experiment

on:
  push:
    branches: [test/fsd-portfolio]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:experiment
      - run: npm run test:scene
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fsd-portfolio-test-build
          path: dist
          retention-days: 14
